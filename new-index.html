<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS practice</title>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="box"><img src="image/1 2.jpg" alt="photo"></div>
            <div class="box"><img src="image/1 2.jpg" alt="photo"></div>
            <div class="box"><img src="image/1 2.jpg" alt="photo"></div>
        </div>
    </div>
<style>
    *{
    margin: 0;
    padding: 0;
}

.wrapper{
    width: 100%;
    position: relative;
}
.box {
    max-width: 320px;
}
.container{
    position: inherit;
    gap: 40px;
    width: 100%;
    display: grid;
    grid-template-columns: 280px 280px 280px;
    justify-content: space-around;
}

@media (max-width: 576px)
{
    .container{
        gap: 40px;
        display: block;
        justify-content: center;
        top: 25%;
        left: 25%;
    }
}
</style>
</body>
</html>
