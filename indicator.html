<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Upload with Preview</title>

<!-- FilePond styles -->
<link href="https://unpkg.com/filepond/dist/filepond.min.css" rel="stylesheet">
<link href="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.min.css" rel="stylesheet">

<!-- Choices.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
<!-- Stepper Library CSS -->
<link rel="stylesheet" href="https://unpkg.com/bs-stepper/dist/css/bs-stepper.min.css" />

<style>
body {
  font-family: Arial, sans-serif;
  padding: 40px;
  box-sizing: border-box;
}
.buttons-creation {
  display: flex;
  flex-direction: row;
  justify-content: center;
  gap: 40px;
  margin-top: 30px;
}
/* Layout */
.creation-section {
  display: flex;
  flex-direction: row;
  gap: 50px;
  flex-wrap: wrap;
}

.main-creation-description {
  display: flex;
  flex-direction: column;
  gap: 40px;
  flex: 1;
  min-width: 280px;
  max-width: 540px;
}

.creation-description {
  display: flex;
  flex-direction: row;
  background: rgba(255, 255, 255, 0.3);
  padding: 20px;
  gap: 16px;
  align-items: center;
  border-radius: 20px;
}

.creation-text {
  color: #2A2A2A;
  font-size: 20px;
  letter-spacing: 130%;
  font-weight: 200;
}

.right-part {
  border: 2px solid black;
  padding: 40px;
  border-radius: 40px;
  flex: 1;
  min-width: 280px;
  max-width: 710px;
  box-sizing: border-box;
}

/* Section titles aligned with fields */
.section-title {
  width: 100%;
  max-width: 500px; 
  margin-left: auto;
  margin-right: auto;
  margin-bottom: 16px;
  text-align: left;
  font-size: 20px;
}

/* FilePond wrapper */
.pond-box {
  border: 2px solid #aaa;
  border-radius: 12px;
  background: white;
  width: 100%;
  max-width: 500px;
  padding: 10px 10px 20px;
  box-sizing: border-box;
  overflow: hidden;
  margin-left: auto;
  margin-right: auto;
}

/* FilePond root transparent inside wrapper */
.filepond--root {
  border: 0 !important;
  background: transparent;
  padding: 0;
  margin: 0;
  box-shadow: none;
}
.filepond--root .filepond--credits { display: none; }

/* Grid: always 3 columns */
.filepond--list.filepond--list {
  display: grid !important;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  justify-items: stretch; 
  list-style-type: none;
}

/* Items identical size */
.filepond--item {
  position: relative !important;
  width: 100% !important;
  height: 200px !important;
  border-radius: 12px;
  overflow: hidden;
  margin: 0 !important;
  transform: none !important;
  transition: all 0.2s ease-in-out !important;
}

/* Inner preview wrapper fills entire item */
.filepond--item .filepond--image-preview-wrapper {
  position: absolute !important;
  top: 0;
  left: 0;
  width: 100% !important;
  height: 100% !important;
}

.filepond--item .filepond--image-preview-wrapper img {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
}

/* Load button */
.filepond-load-btn {
  background-color: #007BFF;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 10px 60px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.2s ease-in-out;
}
.filepond-load-btn:hover { background-color: #0056b3; }

/* Dropdown */
.dropdown-container { 
  width: 100%;
  max-width: 500px;
  position: relative; 
  margin-left: auto;
  margin-right: auto;
}
.dropdown-container select, .dropdown-container .hidden-input { width: 100%; box-sizing: border-box; }
.hidden-input { display: none; margin-top: 10px; }
.hidden-input input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }

.choices { position: relative; overflow: unset; margin-bottom: 24px; font-size: 16px; }
.choices__inner { display: inline-block; width: 100%; background-color: #f9f9f9; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 1.4rem; color: #2A2A2A; }
.dropdown-container .choices__list--dropdown { width: 100% !important; }

/* Buttons */
.button-container button {
  padding: 12px 40px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s ease-in-out;
}
.skip-btn {
  background: #ccc;
  color: #2A2A2A;
}
.skip-btn:hover {
  background: #aaa;
}
.next-btn {
  background: #bbb;
  color: white;
  cursor: not-allowed;
}
.next-btn.active {
  background: #007BFF;
  cursor: pointer;
}
.next-btn.active:hover {
  background: #0056b3;
}
.back-btn {
  background: #666;
  color: white;
}
.back-btn:hover {
  background: #444;
}
.filepond--panel-root {
  border-radius: .5em;
  background-color: white;
}
/* Stepper */
.stepper {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-bottom: 30px;
}
.step {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #ccc;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
}
.line {
  align-items: center;
  flex: 0.1; /* takes available space between steps */
  height: 2px; /* thickness of line */
  background: #ccc; /* inactive line color */
  margin: 0 -2px; /* slight overlap with step circles */
  z-index: 0;
  justify-content: center;
}

.step.active { background: #007BFF; }
.step.completed { background: #4CAF50; }
</style>
</head>
<body>

<!-- Step Indicators -->
<div class="stepper">
  <div class="step" id="step1">1</div>
  <div class="line" id="line1"></div>
  <div class="step" id="step2">2</div>
  <div class="line" id="line1"></div>
  <div class="step" id="step3">3</div>
</div>

<div id="creationSection" class="creation-section">
  <div class="main-creation-description">
    <div class="creation-description">
      <img src="image/image-new/number_1.svg" alt="">
      <div class="creation-text">Choose who is in the photo</div>
    </div>
    <div class="creation-description">
      <img src="image/image-new/number_2.svg" alt="">
      <div class="creation-text">
        Upload 6 photos <br>
        The object must take up a significant portion of the image to be clearly visible
      </div>
    </div>
  </div>

  <div class="right-part">
    <h2 class="section-title">Select Category</h2>
    <div class="dropdown-container">
      <select id="category-select">
        <option value="">Choose category...</option>
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
        <option value="man">Man</option>
        <option value="woman">Woman</option>
        <option value="child">Child</option>
        <option value="another">Another...</option>
      </select>
      <div class="hidden-input" id="custom-input">
        <input type="text" id="customText" placeholder="Type your category...">
      </div>
    </div>

    <div class="creation-photos">
      <h2 class="section-title">Upload 6 Photos</h2>
      <div class="pond-box">
        <input type="file" class="filepond" name="photos" multiple accept="image/*" />
      </div>
    </div>
  </div>
</div>

<!-- Buttons -->
<div class="buttons-creation">
  <button class="back-btn" onclick="showSection('back')">Back</button>
  <button class="skip-btn" id="skipBtn">Skip</button>
  <button id="nextBtn" class="next-btn">Next</button>
</div>

<!-- Sections -->
<div id="skipSection" style="display:none;">
  <h2>You chose to Skip</h2>
  <p>This is the Skip section content.</p>
</div>
<div id="nextSection" style="display:none;">
  <h2>You chose Next</h2>
  <p>This is the Next section content.</p>
</div>

<div id="backSection" style="display:none;">
  <h2>You went Back</h2>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.min.js"></script>
<script src="https://unpkg.com/filepond/dist/filepond.min.js"></script>

<script>
const categorySelect = document.getElementById('category-select');
const choices = new Choices(categorySelect, { searchEnabled: false, itemSelectText: '' });
const customInputDiv = document.getElementById('custom-input');
const customText = document.getElementById('customText');

categorySelect.addEventListener('change', function() {
  if(this.value === 'another'){ customInputDiv.style.display='block'; customText.focus(); }
  else { customInputDiv.style.display='none'; customText.value=''; }
  checkFormCompletion();
});

// FilePond
FilePond.registerPlugin(FilePondPluginImagePreview);
const pond = FilePond.create(document.querySelector('.filepond'), { allowMultiple:true, maxFiles:6, labelIdle:'<button type="button" class="filepond-load-btn" id="customLoadBtn">Load</button>' });
document.addEventListener('click', e=>{ if(e.target.id==='customLoadBtn') pond.browse(); });
pond.on('addfile', checkFormCompletion);
pond.on('removefile', checkFormCompletion);

// Stepper elements
const step1 = document.getElementById('step1');
const step2 = document.getElementById('step2');
const step3 = document.getElementById('step3');

// Initial step
step1.classList.add('active');

// Next button logic
const nextBtn = document.getElementById('nextBtn');
const skipBtn = document.getElementById('skipBtn');

function checkFormCompletion() {
  if(categorySelect.value !== "" && pond.getFiles().length === 6) {
    nextBtn.classList.add("active");
    nextBtn.disabled = false;
  } else {
    nextBtn.classList.remove("active");
    nextBtn.disabled = true;
  }
}

// Show section
function showSection(choice){
  document.getElementById('creationSection').style.display='none';
  document.getElementById('skipSection').style.display='none';
  document.getElementById('nextSection').style.display='none';
  document.getElementById('backSection').style.display='none';

  if(choice==='skip'){ 
    document.getElementById('skipSection').style.display='block'; 
    step1.classList.add('completed'); 
    step2.classList.add('active');
  }
  if(choice==='next'){ 
    document.getElementById('nextSection').style.display='block';
    step1.classList.add('completed'); 
    step2.classList.add('active');
  }
  if(choice==='back'){ 
    document.getElementById('backSection').style.display='block'; 
  }
}

// Button events
skipBtn.addEventListener('click', ()=>{ showSection('skip'); });
nextBtn.addEventListener('click', ()=>{ if(nextBtn.classList.contains('active')) showSection('next'); });
</script>
</body>
</html>
