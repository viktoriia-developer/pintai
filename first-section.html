<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Poppins"
    rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="first-section.css">
    <title>CSS practice</title>
</head>
<body>
    <section class="cards-main">
        <p>
            Immerse <span class="gradient-text">yourself</span>
            into canvas like <span class="van-gogh">Van Gogh</span>
            <br><span class="second-stroke-1-section">AI Paint-by-Numbers</span>
            <br><img class="logo" src="image/logo.svg" alt="Logo" />
        </p>
        <div class="box-container">
            <div class="box">
            <div class="name-card">Turn <span class="bold-text">yourself</span> into masterpieces</div>
            <div class="box">
                <div class="img">
                    <img src="image/11.svg" alt="">
                    <div class="info">
                        <div class="title">1000£</div>
                        <div class="button-get-started">Get Started</div>
                    </div>
                </div>
                <div class="overlay"></div>
            </div>
        </div>
            <div class="box-2">
                <span class="name-card">Bring your dream with prompt</span>
                <div class="box">
                    <div class="img">
                        <img src="image/20.svg" alt="">
                        <div class="info">
                            <div class="title">1000£</div>
                            <div class="button-get-started">Get Started</div>
                        </div>
                    </div>
                    <div class="overlay"></div>
                </div>
            </div>
            <div class="box-3">
                <span class="name-card">Bring your photos into canvas</span>
                <div class="box">
                    <div class="img">
                        <img src="image/21.svg" alt="">
                        <div class="info">
                            <div class="title">1000£</div>
                            <div class="button-get-started">Get Started</div>
                        </div>
                    </div>
                    <div class="overlay"></div>
                </div>
            </div>
        </div>
    </section>
    
</body>
</html>
